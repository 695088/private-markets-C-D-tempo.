[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "private-markets-cd"
version = "0.2.0"
description = "LP contribution / distribution (C/D) tempo framework for private markets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=1.3",
  "numpy>=1.20",
  "openpyxl>=3.0",
  "matplotlib>=3.3",
]

[project.optional-dependencies]
lstm = ["torch>=1.9"]
dev = ["pytest>=7.0"]

[project.scripts]
private-markets-cd = "private_markets_cd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
